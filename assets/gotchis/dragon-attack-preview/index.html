<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dragon Attack — Frame Viewer</title>
  <style>
    :root {
      --bg: #12151c;
      --panel: #1b2130;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #6ee7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 50% 0%, #1e2740, var(--bg));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    .card {
      width: min(920px, 94vw);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 650;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .stage-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 720px) {
      .stage-wrap { grid-template-columns: 1fr; }
    }
    .stage {
      background:
        linear-gradient(45deg, #2a3144 25%, transparent 25%) -12px 0 / 24px 24px,
        linear-gradient(-45deg, #2a3144 25%, transparent 25%) -12px 0 / 24px 24px,
        linear-gradient(45deg, transparent 75%, #2a3144 75%) -12px 0 / 24px 24px,
        linear-gradient(-45deg, transparent 75%, #2a3144 75%) -12px 0 / 24px 24px,
        #1a2030;
      border-radius: 12px;
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }
    canvas {
      image-rendering: pixelated;
      width: 200px;
      height: 200px;
      background: transparent;
    }
    .strip-stage canvas {
      width: min(100%, 620px);
      height: auto;
      aspect-ratio: 6 / 1;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button, label {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: #273149;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: rgba(110,231,255,0.5); }
    button.active {
      background: rgba(110,231,255,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .meta {
      margin-left: auto;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }
    input[type="range"] { width: 140px; }
    .thumbs {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .thumbs button {
      padding: 8px;
      display: grid;
      gap: 6px;
      justify-items: center;
    }
    .thumbs img {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      background: #0e121c;
      border-radius: 6px;
    }
    .thumbs .idx { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Quickswap Dragon — Attack animation</h1>
    <p>
      Row 3 of the side-view sheet · 6 frames · same art used in-game ·
      <a href="../lab/index.html" style="color:#6ee7ff">Sprite Lab hub</a>
      ·
      <a href="../lab/anim-viewer.html?sheet=../quickswap-dragon.png&row=3&frames=6&title=Quickswap%20Dragon%20Attack" style="color:#6ee7ff">reusable viewer</a>
    </p>

    <div class="stage-wrap">
      <div class="stage">
        <canvas id="frameCanvas" width="100" height="100"></canvas>
      </div>
      <div class="stage strip-stage">
        <canvas id="stripCanvas" width="600" height="100"></canvas>
      </div>
    </div>

    <div class="controls">
      <button id="prev" type="button">⟵ Prev</button>
      <button id="play" type="button" class="active">Pause</button>
      <button id="next" type="button">Next ⟶</button>
      <label>Speed <input id="speed" type="range" min="30" max="300" step="10" value="60" /> <span id="speedLabel">60ms</span></label>
      <div class="meta" id="meta">Frame 0 / 5</div>
    </div>

    <div class="thumbs" id="thumbs"></div>
  </div>

  <script>
    const FRAMES = 6;
    const FRAME_MS_DEFAULT = 60;
    const images = [];
    let frame = 0;
    let playing = true;
    let frameMs = FRAME_MS_DEFAULT;
    let acc = 0;
    let last = performance.now();

    const frameCanvas = document.getElementById('frameCanvas');
    const stripCanvas = document.getElementById('stripCanvas');
    const fctx = frameCanvas.getContext('2d');
    const sctx = stripCanvas.getContext('2d');
    fctx.imageSmoothingEnabled = false;
    sctx.imageSmoothingEnabled = false;

    const meta = document.getElementById('meta');
    const playBtn = document.getElementById('play');
    const speedLabel = document.getElementById('speedLabel');
    const thumbs = document.getElementById('thumbs');

    function draw() {
      fctx.clearRect(0, 0, 100, 100);
      if (images[frame]) fctx.drawImage(images[frame], 0, 0);

      sctx.clearRect(0, 0, 600, 100);
      for (let i = 0; i < FRAMES; i++) {
        if (!images[i]) continue;
        sctx.drawImage(images[i], i * 100, 0);
        if (i === frame) {
          sctx.strokeStyle = '#6ee7ff';
          sctx.lineWidth = 2;
          sctx.strokeRect(i * 100 + 1, 1, 98, 98);
        }
      }
      meta.textContent = `Frame ${frame} / ${FRAMES - 1}`;
      [...thumbs.querySelectorAll('button')].forEach((b, i) => {
        b.classList.toggle('active', i === frame);
      });
    }

    function setFrame(i) {
      frame = (i + FRAMES) % FRAMES;
      acc = 0;
      draw();
    }

    function tick(now) {
      const dt = now - last;
      last = now;
      if (playing) {
        acc += dt;
        while (acc >= frameMs) {
          acc -= frameMs;
          frame = (frame + 1) % FRAMES;
        }
        draw();
      }
      requestAnimationFrame(tick);
    }

    Promise.all(
      Array.from({ length: FRAMES }, (_, i) => {
        const img = new Image();
        img.src = `attack-${i}.png`;
        images[i] = img;
        return img.decode().catch(() => {});
      })
    ).then(() => {
      for (let i = 0; i < FRAMES; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML = `<img src="attack-${i}.png" alt="frame ${i}" /><span class="idx">${i}</span>`;
        btn.addEventListener('click', () => {
          playing = false;
          playBtn.textContent = 'Play';
          playBtn.classList.remove('active');
          setFrame(i);
        });
        thumbs.appendChild(btn);
      }
      draw();
      requestAnimationFrame(tick);
    });

    document.getElementById('prev').onclick = () => {
      playing = false;
      playBtn.textContent = 'Play';
      playBtn.classList.remove('active');
      setFrame(frame - 1);
    };
    document.getElementById('next').onclick = () => {
      playing = false;
      playBtn.textContent = 'Play';
      playBtn.classList.remove('active');
      setFrame(frame + 1);
    };
    playBtn.onclick = () => {
      playing = !playing;
      playBtn.textContent = playing ? 'Pause' : 'Play';
      playBtn.classList.toggle('active', playing);
      last = performance.now();
    };
    document.getElementById('speed').oninput = (e) => {
      frameMs = Number(e.target.value);
      speedLabel.textContent = frameMs + 'ms';
    };

    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        playing = false;
        playBtn.textContent = 'Play';
        playBtn.classList.remove('active');
        setFrame(frame - 1);
      } else if (e.key === 'ArrowRight') {
        playing = false;
        playBtn.textContent = 'Play';
        playBtn.classList.remove('active');
        setFrame(frame + 1);
      } else if (e.key === ' ') {
        e.preventDefault();
        playBtn.click();
      }
    });
  </script>
</body>
</html>
